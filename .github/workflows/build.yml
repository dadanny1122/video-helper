name: Build Windows exe

# 每次 video_helper_app.py 的 VERSION 改了並上傳，就自動打包並發布新版
on:
  push:
    branches: [main]
    paths:
      - 'video_helper_app.py'
      - '.github/workflows/build.yml'
      - '.github/ci_smoke.py'
      - '.github/ffmpeg/**'
      - '.github/discord_notify.py'
      - 'requirements.txt'
      - 'CHANGELOG.md'
  workflow_dispatch:

permissions:
  contents: write

env:
  FFMPEG_TAG: n7.1

jobs:
  # 1. 在 Linux 上編 Windows 版的迷你 ffmpeg（只會接檔、換包裝，約 2 MB）
  #    編過一次就存起來；build.sh 或 FFmpeg 版本沒變就直接拿存好的
  ffmpeg:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Reuse a previous build
        id: cache
        uses: actions/cache@v4
        with:
          path: ffmpeg-win
          key: ffmpeg-win-${{ env.FFMPEG_TAG }}-${{ hashFiles('.github/ffmpeg/build.sh') }}

      - name: Build minimal ffmpeg for Windows
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q mingw-w64 nasm
          git clone -q --depth 1 -b "$FFMPEG_TAG" https://github.com/FFmpeg/FFmpeg.git src
          bash .github/ffmpeg/build.sh src "$PWD/ffmpeg-win" windows

      - name: Check it only needs DLLs every Windows has
        run: |
          sudo apt-get install -y -q binutils-mingw-w64-x86-64 >/dev/null
          x86_64-w64-mingw32-objdump -p ffmpeg-win/ffmpeg.exe | grep "DLL Name" | sort -u | tee dlls.txt
          ! grep -viE "KERNEL32|SHELL32|bcrypt|msvcrt|ADVAPI32|USER32|ole32" dlls.txt
          ls -la ffmpeg-win

      - uses: actions/upload-artifact@v4
        with:
          name: ffmpeg-win
          path: ffmpeg-win

  # 2. 在 Windows 上測試、打包 EXE、發布
  build:
    needs: ffmpeg
    runs-on: windows-latest
    permissions:
      contents: write
      id-token: write          # 發布簽章（GitHub 用這個身分證明 EXE 是這個 repo 打包的）
      attestations: write
    steps:
      - uses: actions/checkout@v4

      - name: Read version
        id: ver
        shell: bash
        run: echo "v=$(python -c "import re;print(re.search(r'VERSION = .(.+?).$', open('video_helper_app.py',encoding='utf-8').read(), re.M).group(1))")" >> $GITHUB_OUTPUT

      - name: Check if this version is already released
        id: chk
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "v${{ steps.ver.outputs.v }}" >/dev/null 2>&1; then
            echo "exists=1" >> $GITHUB_OUTPUT
          fi

      - uses: actions/download-artifact@v8
        if: steps.chk.outputs.exists != '1'
        with:
          name: ffmpeg-win
          path: ffmpeg_bin

      - uses: actions/setup-python@v5
        if: steps.chk.outputs.exists != '1'
        with:
          python-version: '3.12'

      # 不裝 imageio-ffmpeg（那是 88 MB 的完整版），改用上面編的迷你版
      # 供應鏈安全：版本和指紋都寫死在 requirements.txt，被換掉就裝不起來
      - name: Install packages (pinned + hash-checked)
        if: steps.chk.outputs.exists != '1'
        run: pip install --require-hashes --no-deps -r requirements.txt

      # 漏洞掃描：已知漏洞（CVE）資料庫裡有我們用的版本就不發布
      - name: Vulnerability scan (pip-audit)
        if: steps.chk.outputs.exists != '1'
        shell: bash
        run: |
          pip install -q pip-audit cyclonedx-bom
          set +e
          pip-audit -r requirements.txt --require-hashes --disable-pip -f markdown > audit_raw.md 2> audit_err.txt
          rc=$?
          set -e
          { echo "# 漏洞掃描（pip-audit）"; echo; echo "掃描時間：$(date -u +%Y-%m-%dT%H:%MZ)，套件清單：requirements.txt"; echo;
            if [ -s audit_raw.md ]; then cat audit_raw.md; else echo "沒有已知漏洞（No known vulnerabilities found）"; fi; } > audit.md
          cat audit.md audit_err.txt
          if [ $rc -ne 0 ]; then echo "::error title=漏洞掃描::有套件有已知漏洞（或掃描失敗），先更新 requirements.txt"; exit 1; fi
          echo "::notice title=漏洞掃描::沒有已知漏洞"
          # SBOM：這個版本用了哪些套件、哪個版本（CycloneDX 格式，附在發布裡）
          cyclonedx-py requirements requirements.txt -o sbom.cdx.json
          echo "::notice title=SBOM::$(python -c "import json;print(len(json.load(open('sbom.cdx.json'))['components']))") 個套件"

      - name: Smoke test (window, tabs, history, bridge, mini ffmpeg on Windows)
        if: steps.chk.outputs.exists != '1'
        timeout-minutes: 5
        env:
          PYTHONIOENCODING: utf-8
          PYTHONUTF8: "1"
        run: python .github/ci_smoke.py

      # 網路流量測試：記錄電腦版所有對外連線，連到 SECURITY.md 清單以外的地方就失敗（擋發布）
      - name: Network allowlist test
        if: steps.chk.outputs.exists != '1'
        timeout-minutes: 15
        env:
          PYTHONIOENCODING: utf-8
          PYTHONUTF8: "1"
        run: python .github/net_test.py

      - name: Secret encryption test (DPAPI)
        if: steps.chk.outputs.exists != '1'
        shell: pwsh
        env:
          PYTHONUTF8: "1"
        run: |
          python -c "import json, tempfile, os, video_helper_app as v; p = os.path.join(tempfile.mkdtemp(), 's.json'); json.dump({'ai_key': 'sk-ant-test-123'}, open(p, 'w')); s = v.Settings(p); raw = json.load(open(p))['ai_key']; print('::notice title=DPAPI::stored as ' + raw[:12] + '...'); assert raw.startswith('dpapi:') and s['ai_key'] == 'sk-ant-test-123', raw; s['ai_key'] = 'new-key'; s.save(); assert v.Settings(p)['ai_key'] == 'new-key'; print('ok')"

      # AI 字幕：真的下載 whisper.cpp ＋ 最小模型，用 Windows 內建語音念一句英文，看聽不聽得出來
      # 失敗就不發布（獨立稽核建議：安全說明寫了「每次發布都跑」，就要真的擋）
      - name: AI subtitle test (real whisper.cpp)
        if: steps.chk.outputs.exists != '1'
        timeout-minutes: 15
        shell: pwsh
        env:
          PYTHONIOENCODING: utf-8
          PYTHONUTF8: "1"
          VIDEO_HELPER_FFMPEG: ffmpeg_bin/ffmpeg.exe
        run: |
          Add-Type -AssemblyName System.Speech
          $s = New-Object System.Speech.Synthesis.SpeechSynthesizer
          $s.SetOutputToWaveFile("$PWD\speech.wav"); $s.Speak("Hello world. This is a subtitle test."); $s.Dispose()
          python -c "import video_helper_app as v; r = v.make_subtitles('speech.wav', 'en', 'tiny'); t = open(r['orig'], encoding='utf-8-sig').read(); print('::notice title=AI subtitle::' + t.replace(chr(10), ' | ')); assert 'hello' in t.lower(), t; assert v.WHISPER_FALLBACKS[0] == 0, '防幻聽選項（VAD）沒生效'; print('::notice title=防幻聽::人聲偵測＋防重複選項有生效')"

      # Pillow 只用來畫系統匣圖示，用不到的圖片格式（AVIF、WebP…）不包進去
      - name: Build exe
        if: steps.chk.outputs.exists != '1'
        run: >
          pyinstaller --onefile --windowed --name VideoHelper
          --collect-all yt_dlp --collect-submodules pystray --collect-data sv_ttk
          --add-binary "ffmpeg_bin/ffmpeg.exe;ffmpeg" --add-binary "ffmpeg_bin/ffprobe.exe;ffmpeg"
          --exclude-module PIL._avif --exclude-module PIL.AvifImagePlugin
          --exclude-module PIL._webp --exclude-module PIL.WebPImagePlugin
          --exclude-module PIL.ImageQt --exclude-module PIL.ImageTk
          --exclude-module imageio_ffmpeg --exclude-module numpy
          video_helper_app.py

      - name: Run the finished exe once (self-test, no window)
        if: steps.chk.outputs.exists != '1'
        shell: bash
        env:
          PYTHONIOENCODING: utf-8
        run: |
          ./dist/VideoHelper.exe --selftest selftest.json || true
          cat selftest.json
          python -c "import json,sys; r=json.load(open('selftest.json',encoding='utf-8')); print('::notice title=EXE self-test::ffmpeg=%s tray=%s ok=%s' % (r.get('ffmpeg_version'), r.get('tray'), r.get('ok'))); sys.exit(0 if r.get('ok') and r.get('frozen') else 1)"
          ls -la dist/VideoHelper.exe
          echo "::notice title=EXE size::$(stat -c %s dist/VideoHelper.exe) bytes"

      # 發布簽章：GitHub 用 Sigstore 簽一張「這個 EXE 是 dadanny1122/video-helper 這次的程式碼在 GitHub Actions 打包的」證明
      # 指紋和簽章不在同一個地方，攻擊者就算換了發布頁的 EXE，也偽造不了 GitHub 的簽章
      - name: Sign build provenance
        if: steps.chk.outputs.exists != '1'
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: dist/VideoHelper.exe
      - name: Sign SBOM
        if: steps.chk.outputs.exists != '1'
        uses: actions/attest-sbom@v2
        with:
          subject-path: dist/VideoHelper.exe
          sbom-path: sbom.cdx.json

      - name: Release notes from CHANGELOG.md
        if: steps.chk.outputs.exists != '1'
        shell: bash
        env:
          PYTHONIOENCODING: utf-8
          PYTHONUTF8: "1"
        run: |
          python - <<'PY'
          import re
          v = "${{ steps.ver.outputs.v }}"
          text = open("CHANGELOG.md", encoding="utf-8").read()
          m = re.search(r"^## v" + re.escape(v) + r"\s*\n(.*?)(?=^## |\Z)", text, re.S | re.M)
          import hashlib
          sha = hashlib.sha256(open("dist/VideoHelper.exe", "rb").read()).hexdigest()
          body = ((m.group(1).strip() if m else "") + "\n\n下載 VideoHelper.exe 雙擊即可使用。"
                  + "\n\n🔒 檔案指紋（SHA-256）：`" + sha + "`"
                  + "\n確認沒被換掉（任選一種）：① `certutil -hashfile VideoHelper.exe SHA256` 結果一模一樣；"
                  + "② 驗 GitHub 簽章（最可靠）：`gh attestation verify VideoHelper.exe -R dadanny1122/video-helper`"
                  + "\n附件：`sbom.cdx.json`＝用了哪些套件和版本、`audit.md`＝漏洞掃描結果")
          open("release_notes.md", "w", encoding="utf-8").write(body.strip())
          PY
          wc -c release_notes.md

      - name: Publish release
        if: steps.chk.outputs.exists != '1'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.v }}
          name: Video Helper v${{ steps.ver.outputs.v }}
          body_path: release_notes.md
          files: |
            dist/VideoHelper.exe
            sbom.cdx.json
            audit.md

      - name: Post the update to Discord
        if: steps.chk.outputs.exists != '1'
        shell: bash
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          PYTHONIOENCODING: utf-8
        run: python .github/discord_notify.py "🖥 電腦版 v${{ steps.ver.outputs.v }} 更新了" release_notes.md "https://github.com/${{ github.repository }}/releases/tag/v${{ steps.ver.outputs.v }}"
