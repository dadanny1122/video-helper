name: Build Windows exe

# 每次 video_helper_app.py 的 VERSION 改了並上傳，就自動打包並發布新版
on:
  push:
    branches: [main]
    paths:
      - 'video_helper_app.py'
      - '.github/workflows/build.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Read version
        id: ver
        shell: bash
        run: echo "v=$(python -c "import re;print(re.search(r'VERSION = .(.+?).$', open('video_helper_app.py',encoding='utf-8').read(), re.M).group(1))")" >> $GITHUB_OUTPUT

      - name: Check if this version is already released
        id: chk
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "v${{ steps.ver.outputs.v }}" >/dev/null 2>&1; then
            echo "exists=1" >> $GITHUB_OUTPUT
          fi

      - uses: actions/setup-python@v5
        if: steps.chk.outputs.exists != '1'
        with:
          python-version: '3.12'

      - name: Install packages
        if: steps.chk.outputs.exists != '1'
        run: pip install yt-dlp imageio-ffmpeg pystray pillow pyinstaller

      - name: Smoke test (window, tabs, history, bundled ffmpeg on Windows)
        if: steps.chk.outputs.exists != '1'
        timeout-minutes: 5
        run: python .github/ci_smoke.py

      - name: Build exe
        if: steps.chk.outputs.exists != '1'
        run: pyinstaller --onefile --windowed --name VideoHelper --collect-all imageio_ffmpeg --collect-all yt_dlp --collect-submodules pystray video_helper_app.py

      - name: Release notes from CHANGELOG.md
        if: steps.chk.outputs.exists != '1'
        shell: bash
        run: |
          python - <<'PY'
          import re
          v = "${{ steps.ver.outputs.v }}"
          text = open("CHANGELOG.md", encoding="utf-8").read()
          m = re.search(r"^## v" + re.escape(v) + r"\s*\n(.*?)(?=^## |\Z)", text, re.S | re.M)
          body = (m.group(1).strip() if m else "") + "\n\n下載 VideoHelper.exe 雙擊即可使用。"
          open("release_notes.md", "w", encoding="utf-8").write(body.strip())
          print(body)
          PY

      - name: Publish release
        if: steps.chk.outputs.exists != '1'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.v }}
          name: Video Helper v${{ steps.ver.outputs.v }}
          body_path: release_notes.md
          files: dist/VideoHelper.exe
