name: Build Windows exe

# 每次 video_helper_app.py 的 VERSION 改了並上傳，就自動打包並發布新版
on:
  push:
    branches: [main]
    paths:
      - 'video_helper_app.py'
      - '.github/workflows/build.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Read version
        id: ver
        shell: bash
        run: echo "v=$(python -c "import re;print(re.search(r'VERSION = .(.+?).$', open('video_helper_app.py',encoding='utf-8').read(), re.M).group(1))")" >> $GITHUB_OUTPUT

      - name: Check if this version is already released
        id: chk
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "v${{ steps.ver.outputs.v }}" >/dev/null 2>&1; then
            echo "exists=1" >> $GITHUB_OUTPUT
          fi

      - uses: actions/setup-python@v5
        if: steps.chk.outputs.exists != '1'
        with:
          python-version: '3.12'

      - name: Install packages
        if: steps.chk.outputs.exists != '1'
        run: pip install yt-dlp imageio-ffmpeg pyinstaller

      - name: Smoke test (open the window once on Windows)
        if: steps.chk.outputs.exists != '1'
        run: python -c "import tkinter as tk, video_helper_app as a; r=tk.Tk(); app=a.App(r); r.update(); assert len(app.step_marks)==3; r.destroy(); print('GUI_OK')"

      - name: Build exe
        if: steps.chk.outputs.exists != '1'
        run: pyinstaller --onefile --windowed --name VideoHelper --collect-all imageio_ffmpeg --collect-all yt_dlp video_helper_app.py

      - name: Publish release
        if: steps.chk.outputs.exists != '1'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.v }}
          name: Video Helper v${{ steps.ver.outputs.v }}
          body: 下載 VideoHelper.exe 雙擊即可使用。
          files: dist/VideoHelper.exe
