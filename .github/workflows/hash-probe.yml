name: Data probe (temporary)
on: workflow_dispatch
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - env:
          CWA_API_KEY: ${{ secrets.CWA_API_KEY }}
        run: |
          python3 - <<'PY'
          import json, os, urllib.request, re
          def get(u, h=None):
              req = urllib.request.Request(u, headers={"User-Agent": "Mozilla/5.0", **(h or {})})
              with urllib.request.urlopen(req, timeout=30) as r:
                  return r.status, r.read().decode("utf-8", "ignore")
          k = os.environ["CWA_API_KEY"]
          for ds in ("E-A0015-001", "E-A0016-001"):
              try:
                  st, t = get(f"https://opendata.cwa.gov.tw/api/v1/rest/datastore/{ds}?Authorization={k}&limit=1&format=JSON")
                  d = json.loads(t)
                  e = d["records"]["Earthquake"][0]
                  info = e.get("EarthquakeInfo", {})
                  print(f"::notice title={ds} keys::" + ",".join(e.keys()) + " | info:" + json.dumps({x: info.get(x) for x in ("OriginTime","FocalDepth","Epicenter","EarthquakeMagnitude")}, ensure_ascii=False)[:600])
                  sa = e.get("Intensity", {}).get("ShakingArea", [])
                  print(f"::notice title={ds} area::" + json.dumps([{x: a.get(x) for x in ("AreaDesc","CountyName","AreaIntensity","InfoStatus")} for a in sa[:6]], ensure_ascii=False)[:900])
                  print(f"::notice title={ds} misc::" + json.dumps({x: e.get(x) for x in ("EarthquakeNo","ReportType","ReportColor","ReportContent","Web","ReportImageURI","ShakemapImageURI")}, ensure_ascii=False)[:700])
              except Exception as ex:
                  print(f"::notice title={ds}::ERR {ex}")
          for name, u in [("aqi-nokey", "https://data.moenv.gov.tw/api/v2/aqx_p_432?format=json&limit=2"),
                          ("cpc", "https://vipmbr.cpc.com.tw/CPCSTN/ListPriceWebService.asmx/getCPCMainProdListPrice"),
                          ("cpc2", "https://vipmbr.cpc.com.tw/cpcstn/listpricewebservice.asmx/getCPCMainProdListPrice_XML"),
                          ("invoice", "https://invoice.etax.nat.gov.tw/invoice.xml")]:
              try:
                  st, t = get(u)
                  print(f"::notice title={name}::{st} {len(t)} " + re.sub(r"\s+", " ", t[:900]))
              except Exception as ex:
                  print(f"::notice title={name}::ERR {ex}")
          PY
