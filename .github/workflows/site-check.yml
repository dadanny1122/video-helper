name: Site change alarm

# 每天台灣時間早上 9:17 檢查一次（GitHub 排程有時會晚一點）；也可以手動按 Run workflow
on:
  schedule:
    - cron: '17 1 * * *'
  workflow_dispatch:
    inputs:
      probe:
        description: '診斷模式（例如 xnxx）：只印出網頁結構，不通知、不存狀態'
        type: string
        default: ''

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      - name: Load state (bot-data branch)
        run: bash .github/bot_data.sh load .github/site_status.json
      - name: Check Pornhub and XVideos pages
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          PYTHONIOENCODING: utf-8
          PROBE: ${{ inputs.probe }}
        run: python3 .github/site_check.py .github/site_status.json

      # 記住今天的狀態，明天才知道有沒有「變」（不會觸發其他自動流程）
      - name: Remember status
        run: |
          bash .github/bot_data.sh save "記住網站檢查結果" .github/site_status.json
