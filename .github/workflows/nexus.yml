# Nexus（節點連線層）的測試：改了 nexus/ 就跑
#   unit（Ubuntu，幾秒）：ruff ＋ 單元測試
#   windows：整合／安全測試（真的起 Master＋Worker，mTLS 在 127.0.0.1）
# 既有下載器的回歸測試仍在 build.yml 的 ci_smoke（AT-020）
name: nexus
on:
  push:
    paths:
      - 'nexus/**'
      - 'webui/i18n.py'
      - 'webui/en.json'
      - '.github/nexus_frozen_check.py'
      - 'requirements-dev.in'
      - 'requirements-dev.txt'
      - 'ruff.toml'
      - 'pytest.ini'
      - '.github/workflows/nexus.yml'
  pull_request:
    paths:
      - 'nexus/**'
      - 'webui/i18n.py'
      - 'webui/en.json'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: '3.12'
      - run: pip install --require-hashes -r requirements-dev.txt
      - name: 需要的執行期套件（之後 PR 會加 cryptography）
        run: pip install --require-hashes -r requirements.txt || true
      - run: ruff check nexus
      - run: python -m pytest nexus/tests/unit -q

  windows:
    runs-on: windows-latest
    needs: unit
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: '3.12'
      - run: pip install --require-hashes -r requirements-dev.txt
      - run: pip install --require-hashes -r requirements.txt
      - name: 整合與安全測試
        shell: pwsh
        run: |
          python -m pytest nexus/tests/unit nexus/tests/integration nexus/tests/security -q -m "not manual"
          # pytest 回 5＝「這兩個資料夾還沒有測試」（PR5 以前）：不算失敗；其他非 0 都要擋
          if ($LASTEXITCODE -eq 5) { Write-Host "還沒有整合測試（PR5 起才有）"; exit 0 }
          exit $LASTEXITCODE

  # V3：打包成 EXE 之後沙箱還正不正常（PyInstaller onefile 會多一層外殼程序）
  frozen:
    runs-on: windows-latest
    needs: unit
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: '3.12'
      - run: pip install --require-hashes -r requirements.txt
      - name: 打包沙箱檢查程式（onefile，跟 VideoHelper.exe 一樣）
        run: pyinstaller --onefile --console --name nexus_frozen_check --paths . .github/nexus_frozen_check.py
      - name: 執行打包後的沙箱檢查
        shell: pwsh
        run: |
          ./dist/nexus_frozen_check.exe | Tee-Object -FilePath frozen.json
          if ($LASTEXITCODE -ne 0) { Write-Output "::error title=打包後沙箱::有項目不對，看上面的 JSON"; exit 1 }
          Write-Output "::notice title=打包後沙箱::寫檔搬運、取消整組結束（含孫程序）、環境變數白名單 OK"

