name: Manual to Discord

# 說明書改了 → 更新 Discord「使用手冊」頻道（改原本的訊息，不會越貼越多）
on:
  push:
    branches: [main]
    paths:
      - 'docs/manual/index.html'
      - '.github/discord_manual.py'
      - '.github/workflows/manual.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: manual-discord
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      - name: Load state (bot-data branch)
        run: bash .github/bot_data.sh load .github/discord_manual_ids.json
      - name: Post or update the manual in Discord
        env:
          DISCORD_MANUAL_WEBHOOK: ${{ secrets.DISCORD_MANUAL_WEBHOOK }}
          PYTHONIOENCODING: utf-8
        run: python3 .github/discord_manual.py post .github/discord_manual_ids.json

      # 記住這次貼的訊息編號，下次才能直接修改（不會再觸發其他自動流程）
      - name: Remember message ids
        run: |
          bash .github/bot_data.sh save "記住 Discord 使用手冊的訊息編號" .github/discord_manual_ids.json
