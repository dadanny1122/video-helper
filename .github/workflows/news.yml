name: News to Discord

# 每 3 小時抓一次這幾個網站的相關新聞（台灣時間 0、3、6、9…點的 23 分左右），新的才貼到 Discord 新聞頻道
on:
  schedule:
    - cron: '23 */3 * * *'
  workflow_dispatch:
    inputs:
      mark_only:
        description: '只記成看過、不貼（修復用）'
        type: boolean
        default: false
      test_verify:
        description: '只測試原文日期檢查（不貼、不記）'
        type: boolean
        default: false
      diagnose:
        description: '診斷：列出這週找到、擋掉的新聞來源（不貼、不記）'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: news-discord
  cancel-in-progress: false

jobs:
  news:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      - name: Load state (bot-data branch)
        run: bash .github/bot_data.sh load .github/news_seen.json
      - name: Fetch news and post new ones
        env:
          DISCORD_NEWS_WEBHOOK: ${{ secrets.DISCORD_NEWS_WEBHOOK }}
          PYTHONIOENCODING: utf-8
        run: python3 .github/news_feed.py .github/news_seen.json ${{ inputs.mark_only && '--mark-only' || '' }} ${{ inputs.test_verify && '--test-verify' || '' }} ${{ inputs.diagnose && '--diagnose' || '' }}

      - name: Remember what was posted
        run: |
          bash .github/bot_data.sh save "記住已貼過的新聞" .github/news_seen.json
