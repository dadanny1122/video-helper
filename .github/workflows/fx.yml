name: Exchange rates to Discord

# 平日台灣時間 9:00～17:00 每小時整點：#匯率 發價格表、#匯率分析 發小方向；17:00 加發大方向總結
# 由外部鬧鐘 cron-job.org 每小時 :55 叫醒（GitHub 自己的排程會遲到好幾小時，例如 16:50 的跑到 19:05 才來，已移除）
on:
  workflow_dispatch:
    inputs:
      probe:
        description: '診斷：看台銀歷史資料的格式'
        type: boolean
        default: false
      export:
        description: '只更新換匯計算機的牌價（不發 Discord；外部鬧鐘每 10 分鐘叫一次）'
        type: boolean
        default: false
      wait:
        description: '等到下一個整點才發（排程被跳過時手動補用）'
        type: boolean
        default: false
      summary:
        description: '馬上發一則「今日匯率總結」（含走勢圖）'
        type: boolean
        default: false
      preview:
        description: '只預覽（印在 Actions 頁面），不發到 Discord'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: fx
  cancel-in-progress: false

jobs:
  fx:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          ref: main
      - name: Install chart library
        run: pip install -q matplotlib
      - name: Load state (bot-data branch)
        run: bash .github/bot_data.sh load .github/fx_state.json docs/fx/rates.json
      - name: Update the rate table
        env:
          DISCORD_FX_WEBHOOK: ${{ secrets.DISCORD_FX_WEBHOOK }}
          DISCORD_FX_ANALYSIS_WEBHOOK: ${{ secrets.DISCORD_FX_ANALYSIS_WEBHOOK }}
          EVENT: ${{ github.event_name }}
          WAIT: ${{ inputs.wait }}
          EXPORT: ${{ inputs.export }}
          PREVIEW: ${{ inputs.preview }}
          PROBE: ${{ inputs.probe }}
          SUMMARY: ${{ inputs.summary }}
          PYTHONIOENCODING: utf-8
        run: python3 .github/fx_feed.py .github/fx_state.json
      - name: Remember the rates
        if: ${{ inputs.preview != true }}
        run: |
          bash .github/bot_data.sh save "記住最新匯率" .github/fx_state.json
      # 換匯計算機網頁的牌價：預覽模式也存（只更新網站，不發 Discord）
      - name: Save calculator rates
        if: always()
        run: |
          bash .github/bot_data.sh save "更新換匯計算機的牌價" docs/fx/rates.json
