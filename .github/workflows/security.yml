name: Security tests

# 瀏覽器腳本的安全測試：改了腳本或測試就自動跑，也可以手動跑
on:
  push:
    paths:
      - 'video-helper.user.js'
      - '.github/security_test.js'
      - '.github/attack_test.js'
      - '.github/attack_bridge.py'
      - '.github/hls_test.js'
      - '.github/hls_test.py'
      - '.github/hls/**'
      - 'video_helper_app.py'
      - 'webui/**'
      - '.github/webui_test.js'
      - '.github/webui_i18n_test.js'
      - '.github/webui_fake.js'
      - '.github/i18n_check.py'
      - '.github/userscript_i18n_test.js'
      - 'nexus/**'
      - '.github/workflows/security.yml'
  workflow_dispatch:

jobs:
  userscript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # HLS（m3u8）解析：腳本和電腦版都用同一份固定假資料測（不連網）
      - name: HLS parser tests (userscript + desktop)
        run: |
          node .github/hls_test.js video-helper.user.js
          python3 -I .github/hls_test.py
      - name: Check mux.js fingerprint (jsDelivr == @require hash)
        run: |
          want=$(grep -o 'mux.min.js#sha256=[0-9a-f]*' video-helper.user.js | cut -d= -f2)
          got=$(curl -sL https://cdn.jsdelivr.net/npm/mux.js@6.3.0/dist/mux.min.js | sha256sum | cut -d' ' -f1)
          echo "::notice title=mux.js 指紋::腳本寫的 $want｜jsDelivr 實際 $got"
          [ "$want" = "$got" ]
      - name: Install Playwright
        run: npm install --no-save playwright@1.48.2 && npx playwright install --with-deps chromium
      # 新介面（電腦版的網頁畫面）：假資料餵進去，檢查畫面、按鈕、網站標題有跳脫、完全不連外
      - name: New UI page test (desktop webui)
        run: node .github/webui_test.js webui-shots
      - name: English UI (dictionary + every page in English)
        run: |
          python3 -I .github/i18n_check.py
          node .github/webui_i18n_test.js webui-shots/en
          node .github/userscript_i18n_test.js video-helper.user.js webui-shots/userscript-en
      - name: Upload new UI screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: webui-page-shots
          path: webui-shots/
          if-no-files-found: ignore
      - name: Userscript privacy test
        run: |
          node .github/security_test.js video-helper.user.js
          VH_LOCALE=en-US node .github/security_test.js video-helper.user.js
      # 攻擊模擬：接上真的電腦版連線服務，腳本走真的配對流程；網站用各種方法偷配對密碼、冒充腳本
      - name: Pairing-token attack simulation
        run: |
          sudo apt-get install -y -q python3-tk >/dev/null
          pip install -q yt-dlp truststore
          PYTHON=python3 node .github/attack_test.js video-helper.user.js
          PYTHON=python3 VH_LOCALE=en-US node .github/attack_test.js video-helper.user.js
