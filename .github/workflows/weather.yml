name: Weather to Discord

# 中央氣象署 → Discord #每日氣象
#   外部鬧鐘（cron-job.org）：每天 7:00 叫 mode=daily（🗓 降雨時間表＋全台總覽）；每小時叫 mode=check（⚡ 降雨突變提醒）
#   每 5 分鐘叫 mode=quake（🌏 地震報告；有 DISCORD_QUAKE_WEBHOOK 就發到那個頻道，沒有就發在 #每日氣象）
on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'daily＝每日時間表＋全台總覽；check＝降雨突變提醒；quake＝地震（鬧鐘每 5 分鐘）'
        type: choice
        options: [check, daily, quake, probe]
        default: check
      preview:
        description: '只預覽（印在 Actions 頁面），不發到 Discord'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: weather
  cancel-in-progress: false

jobs:
  weather:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Fetch forecast and post
        env:
          CWA_API_KEY: ${{ secrets.CWA_API_KEY }}
          DISCORD_WEATHER_WEBHOOK: ${{ secrets.DISCORD_WEATHER_WEBHOOK }}
          DISCORD_QUAKE_WEBHOOK: ${{ secrets.DISCORD_QUAKE_WEBHOOK }}
          MOENV_API_KEY: ${{ secrets.MOENV_API_KEY }}
          MODE: ${{ inputs.mode }}
          PREVIEW: ${{ inputs.preview }}
          PYTHONIOENCODING: utf-8
        run: python3 .github/weather_feed.py .github/weather_state.json
      - name: Remember alerts
        if: ${{ inputs.preview != true }}
        run: |
          [ -f .github/weather_state.json ] || exit 0
          git add .github/weather_state.json
          git diff --cached --quiet && exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898+github-actions[bot]@users.noreply.github.com"
          git commit -m "記住各地點現在是不是在下雨"
          for i in 1 2 3; do git pull --rebase -q origin main && git push -q origin HEAD:main && break; sleep 5; done
