name: Weather to Discord

# 中央氣象署 → Discord #每日氣象
#   外部鬧鐘（cron-job.org）：每天 7:00 叫 mode=daily（全台總覽＋降雨提醒）；每 3 小時叫 mode=check（只看降雨提醒）
on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'daily＝全台總覽＋提醒；check＝只檢查降雨提醒'
        type: choice
        options: [check, daily]
        default: check
      preview:
        description: '只預覽（印在 Actions 頁面），不發到 Discord'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: weather
  cancel-in-progress: false

jobs:
  weather:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Fetch forecast and post
        env:
          CWA_API_KEY: ${{ secrets.CWA_API_KEY }}
          DISCORD_WEATHER_WEBHOOK: ${{ secrets.DISCORD_WEATHER_WEBHOOK }}
          MODE: ${{ inputs.mode }}
          PREVIEW: ${{ inputs.preview }}
          PYTHONIOENCODING: utf-8
        run: python3 .github/weather_feed.py .github/weather_state.json
      - name: Remember alerts
        if: ${{ inputs.preview != true }}
        run: |
          [ -f .github/weather_state.json ] || exit 0
          git add .github/weather_state.json
          git diff --cached --quiet && exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898+github-actions[bot]@users.noreply.github.com"
          git commit -m "記住已經發過的降雨提醒"
          for i in 1 2 3; do git pull --rebase -q origin main && git push -q origin HEAD:main && break; sleep 5; done
