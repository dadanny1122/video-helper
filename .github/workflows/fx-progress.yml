name: FX progress to Discord

# 改了 .github/fx_progress.md 或 fx_manual.md → 貼到 Discord #匯率進度；也可以手動按 Run workflow 再貼一次
on:
  push:
    branches: [main]
    paths: ['.github/fx_progress.md', '.github/fx_manual.md']
  workflow_dispatch:

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Post progress and manual
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_FX_PROGRESS_WEBHOOK }}
          PYTHONIOENCODING: utf-8
        run: |
          python3 .github/discord_notify.py "💱 匯率機器人進度（$(TZ=Asia/Taipei date +%m/%d)）" .github/fx_progress.md "https://github.com/${{ github.repository }}"
          python3 .github/discord_notify.py "📖 匯率頻道說明書" .github/fx_manual.md "https://dadanny1122.github.io/video-helper/fx/"
