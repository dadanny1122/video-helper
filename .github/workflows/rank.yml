name: Ranking to Discord

# 每天台灣時間晚上 8 點整更新 Discord 排行榜頻道
# GitHub 排程常常晚到、甚至跳過 → 18:31、19:13、19:47 提早啟動，程式等到 20:00 整才貼；
# 當天已經貼過的就跳過（同一時間只會有一個在跑）
on:
  schedule:
    - cron: '31 10 * * *'   # 台灣 18:31
    - cron: '13 11 * * *'   # 台灣 19:13
    - cron: '47 11 * * *'   # 台灣 19:47
  workflow_dispatch:
    inputs:
      repost:
        description: '刪掉舊的排行榜訊息，重新貼一份新的'
        type: boolean
        default: false
      preview:
        description: '只預覽（印在 Actions 頁面），不發到 Discord'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: rank
  cancel-in-progress: false

jobs:
  rank:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main   # 拿最新的狀態檔（才知道今天貼過了沒）

      - name: Update the ranking message
        env:
          DISCORD_RANK_WEBHOOK: ${{ secrets.DISCORD_RANK_WEBHOOK }}
          PYTHONIOENCODING: utf-8
          REPOST: ${{ inputs.repost }}
          PREVIEW: ${{ inputs.preview }}
          EVENT: ${{ github.event_name }}
        run: python3 .github/rank_feed.py .github/rank_state.json

      - name: Remember the ranking
        if: ${{ inputs.preview != true }}
        run: |
          [ -f .github/rank_state.json ] || exit 0
          git add .github/rank_state.json
          git diff --cached --quiet && exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898+github-actions[bot]@users.noreply.github.com"
          git commit -m "記住今天的網站排行"
          for i in 1 2 3; do git pull --rebase -q origin main && git push -q origin HEAD:main && break; sleep 5; done
