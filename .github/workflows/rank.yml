name: Ranking to Discord

# 每天台灣時間晚上 8 點檢查 ThePornDude 的影片網站排行，更新 Discord 排行榜頻道
# （GitHub 排程常會晚幾分鐘，所以設 19:55 開始跑，大約 8 點貼出）
on:
  schedule:
    - cron: '55 11 * * *'   # UTC 11:55 = 台灣 19:55
    # GitHub 忙的時候排程會被延後或直接跳過 → 多兩個備用時間；今天已經貼過就自動跳過
    - cron: '25 12 * * *'   # 台灣 20:25
    - cron: '55 12 * * *'   # 台灣 20:55
  workflow_dispatch:
    inputs:
      repost:
        description: '刪掉舊的排行榜訊息，重新貼一份新的'
        type: boolean
        default: false
      preview:
        description: '只預覽（印在 Actions 頁面），不發到 Discord'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  rank:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Update the ranking message
        env:
          DISCORD_RANK_WEBHOOK: ${{ secrets.DISCORD_RANK_WEBHOOK }}
          PYTHONIOENCODING: utf-8
          REPOST: ${{ inputs.repost }}
          PREVIEW: ${{ inputs.preview }}
          EVENT: ${{ github.event_name }}
        run: python3 .github/rank_feed.py .github/rank_state.json

      - name: Remember the ranking
        if: ${{ inputs.preview != true }}
        run: |
          [ -f .github/rank_state.json ] || exit 0
          git add .github/rank_state.json
          git diff --cached --quiet && exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898+github-actions[bot]@users.noreply.github.com"
          git commit -m "記住今天的網站排行"
          for i in 1 2 3; do git pull --rebase -q origin main && git push -q origin HEAD:main && break; sleep 5; done
