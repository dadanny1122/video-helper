<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>即時介面</title>
<link rel="icon" href="favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  /* Video Helper 設計語言：青藍 #57C8FF → 紫 #8B7CFF（電腦版、腳本面板共用） */
  :root {
    --bg:#f4f6fb; --bg2:#eef1f8; --fg:#121826; --muted:#5f6b7f; --card:rgba(255,255,255,.78); --card-solid:#fff;
    --line:rgba(18,24,38,.08); --line2:rgba(18,24,38,.14); --shadow:0 1px 2px rgba(18,24,38,.04),0 8px 28px rgba(18,24,38,.07);
    --a1:#1d8fe0; --a2:#6a4cff; --blue:#1d6fd1; --up:#d93636; --dn:#1e8e5a; --ok:#1e8e5a; --warn:#b26a00; --bad:#d93636;
    --glow1:rgba(87,200,255,.28); --glow2:rgba(139,124,255,.22); --tip:rgba(30,142,90,.08); --chip:rgba(18,24,38,.05);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg:#0a0d14; --bg2:#0d111b; --fg:#e8ecf4; --muted:#8e98ab; --card:rgba(22,27,38,.72); --card-solid:#151a25;
      --line:rgba(255,255,255,.07); --line2:rgba(255,255,255,.12); --shadow:0 1px 0 rgba(255,255,255,.04) inset,0 12px 40px rgba(0,0,0,.45);
      --a1:#57c8ff; --a2:#8b7cff; --blue:#7cc4ff; --up:#ff6b6b; --dn:#3ddc97; --ok:#3ddc97; --warn:#ffb547; --bad:#ff6b6b;
      --glow1:rgba(87,200,255,.16); --glow2:rgba(139,124,255,.16); --tip:rgba(61,220,151,.08); --chip:rgba(255,255,255,.06);
    }
  }
  * { box-sizing:border-box; }
  html { background:var(--bg); }
  body {
    margin:0; min-height:100vh; color:var(--fg); -webkit-font-smoothing:antialiased;
    font:15px/1.65 "Inter","Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;
    background:
      radial-gradient(900px 520px at 8% -8%, var(--glow1), transparent 60%),
      radial-gradient(800px 520px at 100% 0%, var(--glow2), transparent 55%),
      linear-gradient(180deg, var(--bg) 0%, var(--bg2) 100%);
    background-attachment:fixed;
  }
  body::before {      /* 很淡的格線，增加質感 */
    content:""; position:fixed; inset:0; pointer-events:none; opacity:.5;
    background-image:linear-gradient(var(--line) 1px, transparent 1px), linear-gradient(90deg, var(--line) 1px, transparent 1px);
    background-size:48px 48px; mask-image:radial-gradient(ellipse at 50% 0%, #000 0%, transparent 70%);
  }
  main { position:relative; max-width:1200px; margin:0 auto; padding:28px 16px 64px; }
  a { color:var(--blue); text-decoration:none; } a:hover { text-decoration:underline; }

  /* 頂部 */
  .top { display:flex; align-items:center; justify-content:space-between; gap:16px; flex-wrap:wrap; margin-bottom:22px; }
  .brand { display:flex; align-items:center; gap:14px; margin:0; font-size:28px; font-weight:900; letter-spacing:.5px; }
  .brand img { width:56px; height:56px; border-radius:16px; background:#fff; box-shadow:0 0 0 1px var(--line2), 0 8px 24px var(--glow2); }
  .brand span { background:linear-gradient(90deg, var(--a1), var(--a2)); -webkit-background-clip:text; background-clip:text; color:transparent; }
  .sub { color:var(--muted); margin:2px 0 0; font-size:13.5px; }
  .live { display:inline-flex; align-items:center; gap:8px; padding:7px 14px; border-radius:999px; font-size:13px; font-weight:600;
          background:var(--card); border:1px solid var(--line2); box-shadow:var(--shadow); backdrop-filter:blur(12px); font-variant-numeric:tabular-nums; }
  .live i { width:8px; height:8px; border-radius:50%; background:var(--ok); box-shadow:0 0 0 0 var(--ok); animation:pulse 2s infinite; }
  @keyframes pulse { 0% { box-shadow:0 0 0 0 rgba(61,220,151,.6); } 70% { box-shadow:0 0 0 9px rgba(61,220,151,0); } 100% { box-shadow:0 0 0 0 rgba(61,220,151,0); } }

  /* 卡片 */
  .grid { display:grid; grid-template-columns:repeat(2, minmax(0,1fr)); gap:16px; }
  @media (min-width:1100px) {    /* 寬螢幕：三欄；天氣表比較寬，佔兩欄，右邊疊系統狀態＋網站檢查 */
    .grid { grid-template-columns:repeat(3, minmax(0,1fr)); align-items:start;
            grid-template-areas:"fx rank news" "weather weather health" "weather weather sites"; }
    #fx { grid-area:fx } #rank { grid-area:rank } #news { grid-area:news }
    #weather { grid-area:weather } #health { grid-area:health } #sites { grid-area:sites }
    #fx, #rank, #news { align-self:stretch; }
  }
  @media (max-width:820px) { .grid { grid-template-columns:1fr; } }
  .box {
    position:relative; background:var(--card); border:1px solid var(--line); border-radius:18px; padding:16px 18px 14px;
    min-height:230px; overflow:hidden; box-shadow:var(--shadow); backdrop-filter:blur(16px) saturate(140%);
    transition:transform .25s ease, border-color .25s ease, box-shadow .25s ease; animation:rise .5s ease both;
  }
  .box::before {      /* 卡片上緣一條品牌色光 */
    content:""; position:absolute; left:18px; right:18px; top:0; height:1px;
    background:linear-gradient(90deg, transparent, var(--a1), var(--a2), transparent); opacity:.7;
  }
  .box:hover { transform:translateY(-2px); border-color:var(--line2); }
  .grid .box:nth-child(2) { animation-delay:.05s } .grid .box:nth-child(3) { animation-delay:.1s }
  .grid .box:nth-child(4) { animation-delay:.15s } .grid .box:nth-child(5) { animation-delay:.2s } .grid .box:nth-child(6) { animation-delay:.25s }
  @keyframes rise { from { opacity:0; transform:translateY(8px); } to { opacity:1; transform:none; } }
  @media (prefers-reduced-motion: reduce) { .box, .live i { animation:none; } }
  .box h2 { margin:0 0 2px; padding:0; border:0; font-size:17px; font-weight:800; letter-spacing:.3px;
            display:flex; justify-content:space-between; align-items:center; gap:8px; }
  .box h2 a { font-size:12px; font-weight:600; padding:3px 10px; border-radius:999px; background:var(--chip); color:var(--muted); }
  .box h2 a:hover { color:var(--fg); text-decoration:none; }
  .meta { color:var(--muted); font-size:12.5px; margin-bottom:8px; }

  /* 表格 */
  table { width:100%; border-collapse:collapse; font-size:13.5px; }
  td, th { border-bottom:1px solid var(--line); padding:6px 6px; text-align:left; vertical-align:middle; }
  th { color:var(--muted); font-weight:600; font-size:11.5px; text-transform:uppercase; letter-spacing:.6px; }
  tr:last-child td { border-bottom:0; }
  tbody tr:hover td, table tr:hover td { background:var(--chip); }
  .num { text-align:right; font-variant-numeric:tabular-nums; white-space:nowrap; font-feature-settings:"tnum"; }
  .up { color:var(--up); font-weight:600; } .dn { color:var(--dn); font-weight:600; }
  .dot { display:inline-block; width:9px; height:9px; border-radius:50%; margin-right:7px; vertical-align:middle; }
  .g { background:var(--ok); box-shadow:0 0 8px var(--ok); } .y { background:var(--warn); box-shadow:0 0 8px var(--warn); }
  .r { background:var(--bad); box-shadow:0 0 8px var(--bad); } .n { background:#8e98ab; }
  .news a { display:block; text-decoration:none; color:var(--fg); padding:8px 6px; border-bottom:1px solid var(--line); border-radius:8px; }
  .news a:hover { background:var(--chip); } .news a:hover b { text-decoration:none; color:var(--blue); }
  .news small { color:var(--muted); }
  .scroll { max-height:420px; overflow-y:auto; scrollbar-width:thin; scrollbar-color:var(--line2) transparent; }
  .tag { font-size:11.5px; font-weight:600; padding:2px 8px; border-radius:999px; white-space:nowrap; }
  .tag.dl { background:linear-gradient(90deg, var(--a1), var(--a2)); color:#fff; } .tag.ad { background:var(--chip); color:var(--muted); }
  .tip, .warn { border-radius:10px; padding:10px 14px; margin:12px 0; } .tip { background:var(--tip); }
  details { background:var(--chip); border:1px solid var(--line); border-radius:10px; padding:8px 14px; margin:8px 0; }
  summary { cursor:pointer; font-weight:600; }
  #wq select, #wq input { font:inherit; padding:6px 10px; border-radius:10px; border:1px solid var(--line2); background:var(--card-solid); color:var(--fg); }
  footer { margin-top:28px; color:var(--muted); font-size:12.5px; text-align:center; }
</style>
</head>
<body><main>
<header class="top">
  <div>
    <h1 class="brand"><img src="logo.png" alt=""><span>即時介面</span></h1>
    <p class="sub">匯率、排行榜、新聞、天氣、機器人狀態一次看・每分鐘自動刷新</p>
  </div>
  <div class="live"><i></i>LIVE <span id="clock"></span></div>
</header>

<div class="grid">
  <section class="box" id="fx"><h2>💱 匯率 <a href="../fx/calc.html">🧮 計算機</a></h2><div class="meta">讀取中…</div></section>
  <section class="box" id="rank"><h2>🏆 排行榜 <a href="https://theporndude.com/zh/top-porn-tube-sites">來源</a></h2><div class="meta">讀取中…</div></section>
  <section class="box" id="news"><h2>📰 新聞</h2><div class="meta">讀取中…</div></section>
  <section class="box" id="weather"><h2>🌦 天氣 <a href="https://www.cwa.gov.tw/V8/C/W/County/index.html">中央氣象署</a></h2><div class="meta">讀取中…</div></section>
  <section class="box" id="health"><h2>🩺 系統狀態 <a href="https://github.com/dadanny1122/video-helper/actions">GitHub</a></h2><div class="meta">讀取中…</div></section>
  <section class="box" id="sites"><h2>🌐 支援網站檢查</h2><div class="meta">讀取中…</div></section>
</div>
<footer>資料：臺灣銀行牌告匯率、ThePornDude、Tranco、各新聞媒體、中央氣象署、GitHub Actions｜數據整理，非買賣建議｜<a href="../fx/">📖 匯率說明書</a></footer>
</main>
<script>
const RAW = 'https://raw.githubusercontent.com/dadanny1122/video-helper/main/';
const API = 'https://api.github.com/repos/dadanny1122/video-helper/actions/runs?per_page=100';
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const get = p => fetch(RAW + p + '?t=' + Date.now()).then(r => { if (!r.ok) throw new Error(r.status); return r.json(); });
const body = (id, html) => { const b = $(id); b.querySelectorAll(':scope > :not(h2)').forEach(e => e.remove()); b.insertAdjacentHTML('beforeend', html); };
const twNow = () => new Date(new Date().toLocaleString('en-US', { timeZone: 'Asia/Taipei' }));
const ago = t => { const m = Math.round((Date.now() - new Date(t)) / 60000); return m < 60 ? `${m} 分鐘前` : m < 1440 ? `${Math.round(m / 60)} 小時前` : `${Math.round(m / 1440)} 天前`; };
const fmt = v => v == null ? '—' : v < 1 ? v.toFixed(4) : v < 10 ? v.toFixed(3) : v.toFixed(2);

async function fx() {
  try {
    const d = await get('docs/fx/rates.json');
    const rows = Object.entries(d.rates).map(([c, r]) => {
      const m = r.spot_buy && r.spot_sell ? (r.spot_buy + r.spot_sell) / 2 : (r.cash_buy + r.cash_sell) / 2;
      const pct = r.prev_mid ? (m / r.prev_mid - 1) * 100 : null;
      const pos = r.pctl30 == null ? '' : r.pctl30 <= 20 ? '🟢' : r.pctl30 >= 80 ? '🔴' : '🟡';
      return `<tr><td>${r.flag} ${r.zh}</td><td class="num">${fmt(m)}</td>
        <td class="num ${pct > 0 ? 'up' : pct < 0 ? 'dn' : ''}">${pct == null ? '—' : (pct > 0 ? '+' : '') + pct.toFixed(2) + '%'}</td>
        <td class="num">${pos} ${r.pctl30 ?? ''}</td><td class="num">${fmt(r.cash_sell)}</td></tr>`;
    }).join('');
    body('fx', `<div class="meta">台銀掛牌：${esc(d.quote_time || '—')}｜更新：${esc(d.updated)}</div>
      <table><tr><th>貨幣</th><th class="num">中間價</th><th class="num">比前一日</th><th class="num">30天位置</th><th class="num">現鈔賣出</th></tr>${rows}</table>
      <div class="meta" style="margin-top:6px">30天位置：0＝最便宜、100＝最貴（🟢 便宜 20%、🔴 貴 20%）</div>
      <div class="meta" id="arena" style="margin-top:4px"></div>`);
    get('docs/fx/arena.json').then(a => {
      const dir = Object.entries(a.dir).filter(([, x]) => x.n).map(([m, x]) => [m, x.k / x.n * 100]).sort((p, q) => q[1] - p[1]);
      const rng = Object.entries(a.rng).filter(([, x]) => x.n).map(([m, x]) => [m, x.in / x.n * 100]).sort((p, q) => Math.abs(p[1] - 68) - Math.abs(q[1] - 68));
      const el = document.getElementById('arena');
      if (el && dir.length) el.innerHTML = `🏟 <a href="../fx/#arena">預報擂台</a>（${esc(a.updated)}）：方向第一 ${esc(dir[0][0])} ${dir[0][1].toFixed(1)}%（丟硬幣 50%）｜範圍最準 ${esc(rng[0][0])} ${rng[0][1].toFixed(1)}%（目標 68%）`;
    }).catch(() => {});
  } catch (e) { body('fx', `<div class="meta">讀不到匯率（${esc(e.message)}）</div>`); }
}

async function rank() {
  try {
    const d = await get('.github/rank_state.json');
    const FULL = ['pornhub', 'xvideos', 'xnxx', 'redtube', 'youporn', 'xhamster', 'tube8', 'youjizz', 'spankbang'];
    const tr = d.tranco || {};
    const order = Object.keys(tr).sort((a, b) => tr[a] - tr[b]);
    const rows = (d.rows || []).map(([p, n, u]) => {
      const dl = FULL.includes(n.replace(/\s*\(.*\)$/, '').trim().toLowerCase());
      const f = order.indexOf(n);
      return `<tr><td class="num">${p}</td><td><a href="${esc(u)}">${esc(n)}</a></td>
        <td><span class="tag ${dl ? 'dl' : 'ad'}">${dl ? '⬇ 可下載' : '只擋廣告'}</span></td>
        <td class="num">${f >= 0 ? '流量第 ' + (f + 1) : '—'}</td></tr>`;
    }).join('');
    body('rank', `<div class="meta">每天 20:00 更新｜最後：${esc(d.updated || '—')}｜流量＝Tranco 全球排名重排</div>
      <div class="scroll"><table><tr><th class="num">#</th><th>網站</th><th>功能</th><th class="num">流量</th></tr>${rows}</table></div>`);
  } catch (e) { body('rank', `<div class="meta">讀不到排行榜（${esc(e.message)}）</div>`); }
}

async function news() {
  try {
    const d = await get('.github/news_seen.json');
    const list = d.recent || [];
    body('news', list.length ? `<div class="meta">最近貼出的 ${list.length} 則（只收認識的新聞媒體）</div><div class="news scroll">` +
      list.map(n => `<a href="${esc(n.link)}" target="_blank" rel="noopener"><b>${esc(n.title)}</b>
        ${n.zh ? `<br><small>🈯 ${esc(n.zh)}</small>` : ''}
        <br><small>🏷 ${esc(n.topic)}｜📰 ${esc(n.source)}${n.when ? '｜' + ago(n.when) : ''}</small></a>`).join('') + '</div>'
      : '<div class="meta">還沒有記錄到新聞（下一則新聞貼出後就會出現）</div>');
  } catch (e) { body('news', `<div class="meta">讀不到新聞（${esc(e.message)}）</div>`); }
}

async function weather() {
  try {
    const d = (await get('.github/weather_state.json')).dash;
    if (!d) throw new Error('還沒有資料');
    const icon = w => /雷/.test(w) ? '⛈' : /雨/.test(w) ? '🌧' : /陰/.test(w) ? '☁' : /多雲/.test(w) ? (/晴/.test(w) ? '⛅' : '🌥') : /晴/.test(w) ? '☀' : '🌤';
    const rows = Object.entries(d.spots).map(([n, v]) => {
      const now = v.now || {}, pk = v.peak || {};
      const hot = p => p >= 70 ? ' ☔' : '';
      return `<tr><td>${esc(n)}</td><td>${icon(now.wx || '')} ${esc(now.wx || '—')}</td>
        <td class="num">${now.pop ?? '—'}%${hot(now.pop)}</td>
        <td class="num">${pk.range ? pk.range + ' 點 ' + pk.pop + '%' + hot(pk.pop) : '—'}</td>
        <td class="num">${v.temp ? v.temp[0] + '–' + v.temp[1] + '°' : '—'}</td></tr>`;
    }).join('');
    const wet = Object.entries(d.spots).filter(([, v]) => (v.peak || {}).pop >= 70).map(([n]) => n);
    const hz = Object.entries(d.warnings || {}).flatMap(([c, hs]) => hs.map(h => `${c} ${h.phen}${h.sig}`));
    const keep = document.getElementById('wq');                     // 每分鐘刷新時，保留使用者選好的查詢條件
    const prev = keep ? { s: keep.querySelector('#wqS').value, d: keep.querySelector('#wqD').value, h: keep.querySelector('#wqH').value } : null;
    const days = [...new Set(Object.values(d.blocks || {}).flat().map(b => b[0].slice(0, 10)))].sort();
    const dayName = x => { const t = twNow(); const k = i => { const z = new Date(t); z.setDate(z.getDate() + i); return z.toLocaleDateString('sv-SE'); };
      return x === k(0) ? '今天' : x === k(1) ? '明天' : x === k(2) ? '後天' : x.slice(5); };
    body('weather', `<div class="meta">更新：${esc(d.updated)}（每小時）｜降雨機率是 3 小時一段</div>
      ${hz.length ? `<div class="meta" style="color:#e53935;font-weight:600">⛈ 特報：${hz.map(esc).join('、')}</div>` : ''}
      ${d.aqi ? `<div class="meta">🌫 空氣品質（AQI）：${Object.entries(d.aqi).map(([n, v]) => `${esc(n.split('（')[0])} ${v.icon}${v.aqi}`).join('　')}</div>` : ''}
      ${d.quake ? `<div class="meta">🌏 最近地震：<a href="${esc(d.quake.url || '#')}" target="_blank" rel="noopener">${esc(d.quake.text || d.quake.title)}</a></div>` : ''}
      <div class="meta" style="color:var(--fg)">${wet.length ? '☔ 今天要帶傘：' + wet.map(esc).join('、') : '☀ 今天剩下的時段降雨機率都低於 70%'}</div>
      <table><tr><th>地點</th><th>現在天氣</th><th class="num">現在降雨</th><th class="num">今天最可能下雨</th><th class="num">氣溫</th></tr>${rows}</table>
      <div id="wq" style="margin-top:12px;padding:10px;border:1px dashed var(--line);border-radius:8px">
        <b>🔎 查某個時間會不會下雨</b>
        <div style="display:flex;gap:6px;flex-wrap:wrap;margin-top:6px">
          <select id="wqS">${Object.keys(d.blocks || {}).map(n => `<option>${esc(n)}</option>`).join('')}</select>
          <select id="wqD">${days.map(x => `<option value="${x}">${dayName(x)}（${x.slice(5)}）</option>`).join('')}</select>
          <select id="wqH">${Array.from({ length: 24 }, (_, i) => `<option value="${i}">${String(i).padStart(2, '0')}:00</option>`).join('')}</select>
        </div>
        <div id="wqR" style="margin-top:8px"></div>
      </div>`);
    const q = () => {
      const n = $('wqS').value, day = $('wqD').value, h = +$('wqH').value;
      const t = new Date(`${day}T${String(h).padStart(2, '0')}:00:00+08:00`);
      const b = (d.blocks[n] || []).find(x => new Date(x[0]) <= t && t < new Date(x[1]));
      const tp = (d.temps[n] || []).reduce((a, x) => Math.abs(new Date(x[0]) - t) < Math.abs(new Date(a[0]) - t) ? x : a, (d.temps[n] || [[0, null]])[0]);
      if (!b || b[2] == null) { $('wqR').innerHTML = '<span class="meta">這個時間超出預報範圍（只有未來約 2 天）</span>'; return; }
      $('wqR').innerHTML = `${icon(b[3])} <b>${esc(n)}　${dayName(day)} ${String(h).padStart(2, '0')}:00</b>　${esc(b[3])}<br>
        💧 降雨機率 <b style="font-size:20px">${b[2]}%</b>${b[2] >= 70 ? ' ☔ 記得帶傘' : ''}　🌡 約 ${tp[1] ?? '—'}°C
        <div class="meta">（${new Date(b[0]).getHours().toString().padStart(2, '0')}–${new Date(b[1]).getHours().toString().padStart(2, '0')} 點這一段的預報）</div>`;
    };
    ['wqS', 'wqD', 'wqH'].forEach(id => $(id).onchange = q);
    if (prev) { $('wqS').value = prev.s; if (days.includes(prev.d)) $('wqD').value = prev.d; $('wqH').value = prev.h; }
    else { const t = twNow(); $('wqH').value = Math.min(23, t.getHours() + 1); }
    q();
  } catch (e) { body('weather', `<div class="meta">讀不到天氣（${esc(e.message)}）</div>`); }
}

// 每個機器人「多久沒跑就算有問題」（分鐘）；只在該跑的時段檢查
const BOTS = [
  { name: 'Exchange rates to Discord', zh: '💱 匯率', limit: () => { const t = twNow(), d = t.getDay(), h = t.getHours() + t.getMinutes() / 60;
      return d >= 1 && d <= 5 && h >= 9.3 && h <= 18 ? 25 : null; } },
  { name: 'Ranking to Discord', zh: '🏆 排行榜', limit: () => 26 * 60 },
  { name: 'News to Discord', zh: '📰 新聞', limit: () => 4 * 60 },
  { name: 'Site change alarm', zh: '🔔 網站檢查', limit: () => 30 * 60 },
  { name: 'Weather to Discord', zh: '🌦 天氣', limit: () => 90 },
];
let lastApi = 0, runsCache = null;
async function health() {
  try {
    if (!runsCache || Date.now() - lastApi > 5 * 60000) {          // GitHub 免登入每小時只能問 60 次 → 5 分鐘問一次
      const r = await fetch(API); if (!r.ok) throw new Error('GitHub ' + r.status);
      runsCache = (await r.json()).workflow_runs; lastApi = Date.now();
    }
    const rows = BOTS.map(b => {
      const run = runsCache.find(x => x.name === b.name && x.status === 'completed');
      const busy = runsCache.find(x => x.name === b.name && x.status !== 'completed');
      if (!run) return `<tr><td>${b.zh}</td><td><span class="dot n"></span>沒有紀錄</td><td></td></tr>`;
      const mins = (Date.now() - new Date(run.updated_at)) / 60000, lim = b.limit();
      const bad = run.conclusion === 'failure', late = lim != null && mins > lim;
      const dot = bad ? 'r' : late ? 'y' : 'g';
      const msg = bad ? '上次失敗' : late ? '太久沒跑' : '正常';
      return `<tr><td>${b.zh}</td><td><span class="dot ${dot}"></span>${msg}${busy ? '（執行中）' : ''}</td>
        <td class="num"><a href="${run.html_url}">${ago(run.updated_at)}</a></td></tr>`;
    }).join('');
    let sites = '';
    try {
      const s = await get('.github/site_status.json');
      sites = Object.entries(s).map(([n, v]) => {
        const dot = v.status === 'ok' ? 'g' : v.status === 'broken' ? 'r' : 'n';
        const msg = v.status === 'ok' ? '正常' : v.status === 'broken' ? '可能改版' : '檢查主機看不到（不算改版）';
        return `<tr><td>${esc(n)}</td><td colspan="2"><span class="dot ${dot}"></span>${msg}</td></tr>`;
      }).join('');
    } catch (e) {}
    body('health', `<table><tr><th>機器人</th><th>狀態</th><th class="num">上次跑完</th></tr>${rows}</table>
      <div class="meta" style="margin-top:8px">🟢 正常｜🟡 太久沒跑｜🔴 上次失敗</div>`);
    body('sites', `<div class="meta">Video Helper 能下載的網站，網頁寫法有沒有改版（每天檢查一次）</div><table>${sites}</table>`);
  } catch (e) { body('health', `<div class="meta">讀不到狀態（${esc(e.message)}）</div>`); }
}

function all() { fx(); rank(); news(); weather(); health();
  $('clock').textContent = twNow().toTimeString().slice(0, 5) + ' 更新'; }
all(); setInterval(all, 60000);
</script>
</body></html>
